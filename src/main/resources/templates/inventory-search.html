<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search and Reports</title>
</head>
<body>

<nav>
    <a th:href="@{/}">Home</a> |
    <a th:href="@{/plants}">Plants</a> |
    <a th:href="@{/supplies}">Supplies</a> |
    <a th:href="@{/local-goods}">Local Goods</a> |
    <a th:href="@{/inventory-search}">Search & Reports</a>
</nav>
<hr>

<h1>Search & Reports</h1>

<form th:action="@{/inventory-search}" method="get">

    <div>
        <label>Item Name:</label>
        <input type="text" name="name">
    </div>
    <br>

    <div>
        <label>Inventory Type:</label>
        <select name="inventoryType">
            <option value="">All</option>
            <option value="plant">Plant</option>
            <option value="supply">Supply</option>
            <option value="localGood">Local Good</option>
        </select>
    </div>
    <br>

    <div>
        <label>Category:</label>
        <input type="text" name="category">
    </div>
    <br>

    <div>
        <label>Vendor / Supplier:</label>
        <input type="text" name="vendorOrSupplier">
    </div>
    <br>

    <div>
        <label>Location:</label>
        <input type="text" name="location">
    </div>
    <br>

    <div>
        <label>Perishable Only:</label>
        <input type="checkbox" name="perishable">
    </div>
    <br>

    <div>
        <label>Low Stock Only:</label>
        <input type="checkbox" name="lowStock">
    </div>
    <br>

    <div>
        <button type="submit">Search</button>
        <a th:href="@{/inventory-search}">Reset</a>
    </div>

</form>

<hr>

<h2>Search Results</h2>

<p th:if="${results == null}">Search results will appear here.</p>

<p th:if="${results != null and #lists.isEmpty(results)}">No results found.</p>

<table border="1" th:if="${results != null and !#lists.isEmpty(results)}">
    <thead>
    <tr>
        <th>Name</th>
        <th>Category</th>
        <th>Vendor</th>
        <th>Location</th>
        <th>Perishable</th>
        <th>Quantity In Stock</th>
        <th>Reorder Level</th>
        <th>Price</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${results}">
        <td th:text="${item.name}"></td>
        <td th:text="${item.category}"></td>
        <td th:text="${item.localVendor}"></td>
        <td th:text="${item.location}"></td>
        <td th:text="${item.perishable} ? 'Yes' : 'No'"></td>
        <td th:text="${item.quantityInStock}"></td>
        <td th:text="${item.reorderLevel}"></td>
        <td th:text="${item.price}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
