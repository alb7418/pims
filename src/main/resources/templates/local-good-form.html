<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Local Good Form</title>
  <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<div class="container">

  <nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/plants}">Plants</a>
    <a th:href="@{/supplies}">Supplies</a>
    <a th:href="@{/local-goods}">Local Goods</a>
    <a th:href="@{/inventory-search}">Search</a>
    <a th:href="@{/reports}" sec:authorize="hasAnyRole('MANAGER', 'ADMIN')">Reports</a>
  </nav>

  <div class="logout-area">
    <form th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="secondary-button">Logout</button>
    </form>
  </div>

  <hr>

  <h1>Local Good Form</h1>

  <form th:action="@{/local-goods}" th:object="${localGood}" method="post">

    <input type="hidden" th:field="*{id}">

    <div>
      <label>Item Name:</label>
      <input type="text" th:field="*{name}">
      <div class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>
    <br>

    <div>
      <label>Category:</label>
      <input type="text" th:field="*{category}">
      <div class="error-message" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
    </div>
    <br>

    <div>
      <label>Local Vendor:</label>
      <input type="text" th:field="*{localVendor}">
      <div class="error-message" th:if="${#fields.hasErrors('localVendor')}" th:errors="*{localVendor}"></div>
    </div>
    <br>

    <div>
      <label>Price:</label>
      <input type="number" step="0.01" th:field="*{price}">
      <div class="error-message" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
    </div>
    <br>

    <div>
      <label>Quantity in Stock:</label>
      <input type="number" th:field="*{quantityInStock}">
      <div class="error-message" th:if="${#fields.hasErrors('quantityInStock')}" th:errors="*{quantityInStock}"></div>
    </div>
    <br>

    <div>
      <label>Reorder Level:</label>
      <input type="number" th:field="*{reorderLevel}">
      <div class="error-message" th:if="${#fields.hasErrors('reorderLevel')}" th:errors="*{reorderLevel}"></div>
    </div>
    <br>

    <div>
      <label>Location:</label>
      <input type="text" th:field="*{location}">
      <div class="error-message" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
    </div>
    <br>

    <div>
      <label>Perishable:</label>
      <input type="checkbox" th:field="*{perishable}">
    </div>
    <br>

    <div>
      <label>Expiration Date:</label>
      <input type="date" th:field="*{expirationDate}">
      <div class="error-message" th:if="${#fields.hasErrors('expirationDate')}" th:errors="*{expirationDate}"></div>
    </div>
    <br>

    <div>
      <button type="submit">Save</button>
    </div>
    <br>

  </form>

  <p><a th:href="@{/local-goods}">Back to Local Goods Inventory</a></p>

</div>

<footer>
  <p>&copy; 2026 Verdant Roots Nursery | PIMS</p>
</footer>
</body>
</html>
