<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Login | Verdant Roots Nursery</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<div class="container">

    <h1>Verdant Roots Nursery</h1>

    <div class="home-card">
        <h2>PIMS Login</h2>

        <p>
            Sign in to access the Plant Inventory Management System.
        </p>

        <p th:if="${param.error}" class="error-message">
            Invalid username or password.
        </p>

        <p th:if="${param.logout}" class="success-message">
            You have been logged out.
        </p>

        <form th:action="@{/login}" method="post" class="login-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="off" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="off" required>
            </div>

            <button type="submit">Log In</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Verdant Roots Nursery | PIMS</p>
    </footer>

</div>
</body>
</html>
