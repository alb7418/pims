<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Add Plant</title>
  <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<div class="container">

  <nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/plants}">Plants</a>
    <a th:href="@{/supplies}">Supplies</a>
    <a th:href="@{/local-goods}">Local Goods</a>
    <a th:href="@{/inventory-search}">Search</a>
    <a th:href="@{/reports}" sec:authorize="hasAnyRole('MANAGER', 'ADMIN')">Reports</a>
  </nav>

  <div class="logout-area">
    <form th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="secondary-button">Logout</button>
    </form>
  </div>

  <hr>

  <h1>Add New Plant</h1>

  <form th:action="@{/plants}" th:object="${plant}" method="post">

    <input type="hidden" th:field="*{id}">

    <div>
      <label for="commonName">Common Name:</label>
      <input type="text" id="commonName" th:field="*{commonName}">
      <div class="error-message" th:if="${#fields.hasErrors('commonName')}" th:errors="*{commonName}"></div>
    </div>
    <br>

    <div>
      <label for="category">Category:</label>
      <input type="text" id="category" th:field="*{category}">
      <div class="error-message" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
    </div>
    <br>

    <div>
      <label for="supplier">Supplier:</label>
      <input type="text" id="supplier" th:field="*{supplier}">
      <div class="error-message" th:if="${#fields.hasErrors('supplier')}" th:errors="*{supplier}"></div>
    </div>
    <br>

    <div>
      <label for="quantityInStock">Quantity in Stock:</label>
      <input type="number" id="quantityInStock" th:field="*{quantityInStock}">
      <div class="error-message" th:if="${#fields.hasErrors('quantityInStock')}" th:errors="*{quantityInStock}"></div>
    </div>
    <br>

    <div>
      <label for="reorderLevel">Reorder Level:</label>
      <input type="number" id="reorderLevel" th:field="*{reorderLevel}">
      <div class="error-message" th:if="${#fields.hasErrors('reorderLevel')}" th:errors="*{reorderLevel}"></div>
    </div>
    <br>

    <div>
      <label for="price">Price:</label>
      <input type="number" step="0.01" id="price" th:field="*{price}">
      <div class="error-message" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
    </div>
    <br>

    <div>
      <label for="location">Location:</label>
      <input type="text" id="location" th:field="*{location}">
      <div class="error-message" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
    </div>
    <br>

    <div>
      <label for="sunlightNeeds">Sunlight Needs:</label>
      <input type="text" id="sunlightNeeds" th:field="*{sunlightNeeds}">
      <div class="error-message" th:if="${#fields.hasErrors('sunlightNeeds')}" th:errors="*{sunlightNeeds}"></div>
    </div>
    <br>

    <button type="submit">Save Plant</button>
  </form>

  <br>
  <p><a th:href="@{/plants}">Back to Plant Inventory</a></p>

</div>

<footer>
  <p>&copy; 2026 Verdant Roots Nursery | PIMS</p>
</footer>
</body>
</html>
