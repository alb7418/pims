<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Plant</title>
</head>
<body>

<nav>
  <a th:href="@{/}">Home</a> |
  <a th:href="@{/plants}">Plants</a> |
  <a th:href="@{/supplies}">Supplies</a> |
  <a th:href="@{/local-goods}">Local Goods</a> |
  <a th:href="@{/inventory-search}">Search & Reports</a>
</nav>
<hr>

<h1>Add New Plant</h1>

<form th:action="@{/plants}" th:object="${plant}" method="post">

  <input type="hidden" th:field="*{id}">

  <div>
    <label for="commonName">Common Name:</label>
    <input type="text" id="commonName" th:field="*{commonName}">
  </div>
  <br>

  <div>
    <label for="scientificName">Scientific Name:</label>
    <input type="text" id="scientificName" th:field="*{scientificName}">
  </div>
  <br>

  <div>
    <label for="category">Category:</label>
    <input type="text" id="category" th:field="*{category}">
  </div>
  <br>

  <div>
    <label for="supplier">Supplier:</label>
    <input type="text" id="supplier" th:field="*{supplier}">
  </div>
  <br>

  <div>
    <label for="quantityInStock">Quantity in Stock:</label>
    <input type="number" id="quantityInStock" th:field="*{quantityInStock}">
  </div>
  <br>

  <div>
    <label for="reorderLevel">Reorder Level:</label>
    <input type="number" id="reorderLevel" th:field="*{reorderLevel}">
  </div>
  <br>

  <div>
    <label for="price">Price:</label>
    <input type="number" step="0.01" id="price" th:field="*{price}">
  </div>
  <br>

  <div>
    <label for="location">Location</label>
    <input type="text" id="location" th:field="*{location}">
  </div>
  <br>

  <div>
    <label for="sunlightNeeds">Sunlight Needs:</label>
    <input type="text" id="sunlightNeeds" th:field="*{sunlightNeeds}">
  </div>
  <br>

  <button type="submit">Save Plant</button>
</form>

<br>
<p><a th:href="@{/plants}">Back to Plant Inventory</a></p>

</body>
</html>
