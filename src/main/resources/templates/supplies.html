<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Supplies Inventory</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<div class="container">

    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/plants}">Plants</a>
        <a th:href="@{/supplies}">Supplies</a>
        <a th:href="@{/local-goods}">Local Goods</a>
        <a th:href="@{/inventory-search}">Search</a>
        <a th:href="@{/reports}" sec:authorize="hasAnyRole('MANAGER', 'ADMIN')">Reports</a>
    </nav>

    <div class="logout-area">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="secondary-button">Logout</button>
        </form>
    </div>
<hr>

<h1>Supplies Inventory</h1>

<p><a th:href="@{/supplies/new}">Add New Supply</a></p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Item Name</th>
        <th>Supplier</th>
        <th>Quantity</th>
        <th>Reorder Level</th>
        <th>Price</th>
        <th>Location</th>
        <th>Last Updated</th>
        <th>Low Stock</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="supply : ${supplies}">
        <td th:text="${supply.id}">1</td>
        <td th:text="${supply.itemName}">Potting Soil</td>
        <td th:text="${supply.supplier}">Vendor</td>
        <td class="number_cell" th:text="${supply.quantityInStock}">10</td>
        <td class="number_cell" th:text="${supply.reorderLevel}">3</td>
        <td th:text="${#numbers.formatCurrency(supply.price)}">9.99</td>
        <td th:text="${supply.location}">Aisle 2</td>
        <td th:text="${supply.lastUpdated}">2026-04-18</td>
        <td class="low_stock_flag"><span th:if="${supply.quantityInStock <= supply.reorderLevel}">🚩</span></td>
        <td>
            <a th:href="@{/supplies/edit/{id}(id=${supply.id})}">Edit</a>
            <a th:href="@{/supplies/delete/{id}(id=${supply.id})}">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

</div>
</body>
<footer>
    <p>&copy; 2026 Verdant Roots Nursery | PIMS</p>
</footer>
</html>
