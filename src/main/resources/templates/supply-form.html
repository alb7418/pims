<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Supply Form</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<div class="container">

    <nav>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/plants}">Plants</a>
        <a th:href="@{/supplies}">Supplies</a>
        <a th:href="@{/local-goods}">Local Goods</a>
        <a th:href="@{/inventory-search}">Search</a>
        <a th:href="@{/reports}" sec:authorize="hasAnyRole('MANAGER', 'ADMIN')">Reports</a>
    </nav>

    <div class="logout-area">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="secondary-button">Logout</button>
        </form>
    </div>

    <hr>

    <h1>Supply Form</h1>

    <form th:action="@{/supplies}" th:object="${supply}" method="post">

        <input type="hidden" th:field="*{id}">

        <div>
            <label>Item Name:</label>
            <input type="text" th:field="*{itemName}">
            <div class="error-message" th:if="${#fields.hasErrors('itemName')}" th:errors="*{itemName}"></div>
        </div>
        <br>

        <div>
            <label>Supplier:</label>
            <input type="text" th:field="*{supplier}">
            <div class="error-message" th:if="${#fields.hasErrors('supplier')}" th:errors="*{supplier}"></div>
        </div>
        <br>

        <div>
            <label>Quantity:</label>
            <input type="number" th:field="*{quantityInStock}">
            <div class="error-message" th:if="${#fields.hasErrors('quantityInStock')}" th:errors="*{quantityInStock}"></div>
        </div>
        <br>

        <div>
            <label>Reorder Level:</label>
            <input type="number" th:field="*{reorderLevel}">
            <div class="error-message" th:if="${#fields.hasErrors('reorderLevel')}" th:errors="*{reorderLevel}"></div>
        </div>
        <br>

        <div>
            <label>Price:</label>
            <input type="number" step="0.01" th:field="*{price}">
            <div class="error-message" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>
        <br>

        <div>
            <label>Location:</label>
            <input type="text" th:field="*{location}">
            <div class="error-message" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
        </div>
        <br>

        <div>
            <button type="submit">Save</button>
        </div>
        <br>

    </form>

    <br>
    <p><a th:href="@{/supplies}">Back to Supplies Inventory</a></p>

</div>

<footer>
    <p>&copy; 2026 Verdant Roots Nursery | PIMS</p>
</footer>
</body>
</html>
